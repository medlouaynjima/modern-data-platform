name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          python -m pip install -r airflow/requirements.txt
          python -m pip install -r data_quality/requirements.txt
          python -m pip install -r contracts/requirements.txt
          python -m pip install fastapi httpx pandas pyarrow pydantic impyla thrift thrift_sasl
          python -m pip install scikit-learn xgboost joblib scipy

      - name: Lint — compile check
        run: |
          python -m compileall -q \
            producer spark contracts data_quality \
            fastapi streamlit ml airflow tests

      - name: Validate Docker Compose (all profiles)
        run: |
          docker compose config --quiet
          docker compose --profile spark config --quiet
          docker compose --profile dbt config --quiet
          docker compose --profile serving config --quiet
          docker compose --profile ml config --quiet
          docker compose --profile monitoring config --quiet
          docker compose --profile airflow config --quiet

      - name: Run unit tests with coverage
        run: |
          python -m pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
